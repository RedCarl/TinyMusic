name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: ''
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.target, 'aarch64') && 'aarch64-apple-darwin' || startsWith(matrix.target, 'x86_64-apple') && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 给 .app 做完整的 ad-hoc 签名。
          # 不做的话只有链接器盖的 linker-signed 戳，签名不覆盖 Resources，
          # macOS 会判定「应用已损坏，无法打开」。
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v__VERSION__
          releaseName: 'TinyMusic v__VERSION__'
          releaseBody: |
            跨平台音乐客户端（Tauri + Svelte）。官网与下载页：https://redcarl.github.io/TinyMusic/

            - Windows：`TinyMusic_<版本>_x64-setup.exe`，或用 `.msi`
            - macOS：`TinyMusic_<版本>_aarch64.dmg`（Apple 芯片）/ `TinyMusic_<版本>_x64.dmg`（Intel）
            - `.sig` 与 `latest.json` 是应用内自动更新用的，不需要手动下载
            - macOS 首次打开若提示「已损坏」，在 Finder 里右键 → 打开

            安装包未做代码签名，SmartScreen / 门禁提示属正常现象。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
