name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN 没有仓库管理权限，无法替仓库「打开」Pages。
      # 这里先查一次，没开就把话说明白，而不是让后面的步骤报一句难懂的错。
      - name: 检查 Pages 是否已启用
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" != "200" ]; then
            echo "::error::这个仓库还没有启用 GitHub Pages。打开 https://github.com/${{ github.repository }}/settings/pages ，把 Build and deployment 的 Source 设为「GitHub Actions」，然后重新运行本工作流。"
            exit 1
          fi
          echo "Pages 已启用"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
