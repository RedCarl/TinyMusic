name: TinyMusic
options:
  bundleIdPrefix: cn.carljoy
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES

targets:
  TinyMusic:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.carljoy.tinymusic
        PRODUCT_NAME: TinyMusic
        INFOPLIST_FILE: Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Supporting/TinyMusic.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "33"
        DEVELOPMENT_TEAM: BCRZR3P4AP
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Supporting/Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Supporting"]
        OTHER_SWIFT_FLAGS: ["$(inherited)", "-disable-sandbox"]
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-ltinymusic_ffi"]
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Rust/lib"]
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
    preBuildScripts:
      - name: "编译 Rust 后端"
        script: |
          set -e
          if [[ "$SDK_NAME" == iphonesimulator* ]]; then
            case "${ARCHS:-arm64}" in
              *arm64*) RT=aarch64-apple-ios-sim ;;
              *) RT=x86_64-apple-ios ;;
            esac
          else
            RT=aarch64-apple-ios
          fi
          if [[ "$CONFIGURATION" == "Debug" ]]; then
            PROF=debug; PA=""
          else
            PROF=release; PA="--release"
          fi
          mkdir -p "$SRCROOT/Rust/lib"
          cd "$SRCROOT"
          cargo build -p tinymusic-ffi --target "$RT" $PA
          cp "$SRCROOT/target/$RT/$PROF/libtinymusic_ffi.a" "$SRCROOT/Rust/lib/libtinymusic_ffi.a"
          echo "[TinyMusic] Rust 静态库就绪: $RT/$PROF"
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - TinyMusicTests
        - TinyMusicUITests
      gatherCoverageData: true

  TinyMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TinyMusicTests
    dependencies:
      - target: TinyMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.carljoy.tinymusic.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TinyMusic.app/TinyMusic"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TinyMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TinyMusicUITests
    dependencies:
      - target: TinyMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.carljoy.tinymusic.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TinyMusic
