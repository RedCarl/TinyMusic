[package]
name = "tinymusic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TinyMusic — 轻量多平台音乐客户端"

[lib]
name = "tinymusic_app"
# 桌面端只需要 rlib。`staticlib` / `cdylib` 是移动端（iOS/Android）才需要的产物：
# 在 Windows + MinGW 上链接 cdylib 会因为导出符号超过 65535 个而失败
# （ld: error: export ordinal too large）。要出移动包时再临时加回来。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tinymusic-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
