[package]
name = "tinymusic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Music provider protocol core (Kuwo-compatible), no UI dependencies"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "fs",
  "io-util",
  "sync",
  "time",
  "net",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
# 用于解 musicinfo 的自定义包（[u32][u32][zlib]），纯 Rust 后端避免 C 依赖
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
# S3 SigV4 签名（只用 SHA-256 / HMAC-SHA256，不引 aws-sdk）
sha2 = "0.10"
hmac = "0.12"
# 网易云 weapi：AES-128-CBC 双层加密 + 教科书 RSA 的模幂
aes = "0.8"
num-bigint = "0.4"
# 手机号登录要提交 md5(密码)
md-5 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
